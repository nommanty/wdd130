<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us - White Water Rafting</title>
    <meta name="description"
      content="White Water Rafting contact page. In this page you can find telephone number, adresses and an email.">
    <meta name="author" content="Andres Quispe">

    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/company-logo.png" alt="Company Logo" width="125">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>
        <section class="contact-information">
            <h1>White Water Rafting Company</h1>
            <p>456 Canyon Rapids Avenue</p>
            <p>Moab, Utah</p>
            <p>+1 435 555 0178</p>
            <p>info@whitewater.com</p>
        </section>

        <section class="contact-layout">

            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4899867.09792454!2d-126.31570070355187!3d38.07176584418564!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x809b056bc65e2377%3A0xf92c07d60aa23526!2sSierra%20Whitewater%20-%20American%20River%20Rafting%20near%20Sacramento!5e1!3m2!1sen!2sus"></iframe>

            <form>
                <div>
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="purpose-group">
                    <span class="purpose-title">Message Purpose</span>

                    <div class="purpose-options">
                        <label for="purpose-general">
                            <input type="radio" id="purpose-general" name="purpose"
                              value="general-inquiry" required>
                            General Inquiry
                        </label>

                        <label for="purpose-reservation">
                            <input type="radio" id="purpose-reservation" name="purpose"
                              value="reservation-question">
                            Reservation Question
                        </label>

                        <label for="purpose-website">
                            <input type="radio" id="purpose-website" name="purpose"
                              value="website-suggestion">
                            Website Suggestion
                        </label>
                    </div>
                </div>

                <div>
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required
                      placeholder="Type here"></textarea>
                </div>

                <div class="newsletter-row">
                    <input type="checkbox" id="monthly-subscription" name="monthly_subscription">
                    <label for="monthly-subscription">Please Subscribe me to the monthly
                        newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>


        </section>

        <section class="employees">

            <figure>
                <img src="images/andres.jfif" alt="Tour Guide">
                <figcaption>Andres – River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/pepa.jfif" alt="Safety Leader">
                <figcaption>Pepa – Safety Leader</figcaption>
            </figure>

            <figure>
                <img src="images/maria.jfif" alt="Safety Instructor">
                <figcaption>Maria – Safety Instructor</figcaption>
            </figure>

        </section>

    </main>
    <footer>
        <p>© 2026 🌴 White Water Rafting 🌴 Andres Quispe 🌴</p>
        <nav class="socialmedia">

            <a href="https://facebook.com">
                <img src="images/facebook-mini-logo.png" alt="Facebook Icon" width="100">
            </a>

            <a href="https://linkedin.com">
                <img src="images/linkedin-mini-logo.png" alt="LinkedIn Icon" width="100">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram-mini-logo.png" alt="Instagram Icon" width="100">
            </a>
        </nav>
    </footer>

</body>

</html>
